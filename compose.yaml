services:
  qbit-prunarr:
    build:
      context: ./app
    container_name: qbit-prunarr
    ports:
      - 8585:8585
    environment:
      - PUID=1027
      - PGID=65536
    env_file: .env
    networks:
      - synobridge
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  synobridge:
    external: true
