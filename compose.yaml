services:
  qbit-prunarr:
    build:
      context: ./app
    container_name: qbit-prunarr
    ports:
      - 8585:8585
    env_file: .env
    networks:
      - synobridge
    user: "1027:65536"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Synology's kernel can't enforce this; Docker warns "PIDs limit discarded" and carries on.
    pids_limit: 200
    restart: unless-stopped
    # On the NAS-specific compose (qbit-prunarr-compose/compose.yaml), add:
    #   volumes:
    #     - /volume1/data:/data                       # needed by the orphan trawler
    #     - /volume1/docker/qbit-prunarr/logs:/logs   # for AUDIT_LOG
    volumes: []

networks:
  synobridge:
    external: true
